apiVersion: apps/v1
kind: Deployment
metadata:
  name: documind-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: documind
      component: worker
  template:
    metadata:
      labels:
        app: documind
        component: worker
    spec:
      containers:
        - name: worker
          image: documind:latest
          command: ["celery", "-A", "documind.workers", "worker", "--loglevel=info"]
          envFrom:
            - configMapRef:
                name: documind-config
