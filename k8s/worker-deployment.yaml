apiVersion: apps/v1
kind: Deployment
metadata:
  name: documind-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: documind-worker
  template:
    metadata:
      labels:
        app: documind-worker
    spec:
      containers:
        - name: worker
          image: documind:ci
          command: ["celery", "-A", "documind.workers.celery_app", "worker", "--loglevel=info"]
          envFrom:
            - configMapRef:
                name: documind-config
