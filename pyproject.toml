[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "documind"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29.0",
  "alembic>=1.13.1",
  "pgvector>=0.2.5",
  "celery[redis]>=5.4.0",
  "redis>=5.0.5",
  "openai>=1.30.0",
  "boto3>=1.34.141",
  "tenacity>=9.0.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.0",
  "python-dotenv>=1.0.1",
  "structlog>=24.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.23.6",
  "pytest-cov>=5.0.0",
  "respx>=0.21.0",
  "httpx>=0.27.0",
  "aiosqlite>=0.21.0",
  "factory-boy>=3.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
  "taskipy>=1.12.2",
  "pre-commit>=3.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
strict = true

[tool.taskipy.tasks]
lint = "ruff check src tests"
fmt = "ruff format src tests"
test = "pytest -q"
test-cov = "pytest --cov=src --cov-report=term-missing"
