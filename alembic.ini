# A minimal, modern Alembic configuration.
# The environment is driven through `alembic/env.py` so we keep this file conventional.

[alembic]
script_location = alembic
sqlalchemy.url = postgresql+asyncpg://documind:documind@localhost:5432/documind

[post_write_hooks]
hooks = black, isort

[black]
type = console_scripts
entrypoint = black

[isort]
type = console_scripts
entrypoint = isort

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
